name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build
        run: |
          npm install
          npm run build --workspaces --if-present

      - name: Run unit & integration tests
        run: |
          npm run test --workspaces --if-present

      - name: Run Action on demo server
        uses: ./
        with:
          command: "node mcp-check-demo/server.js --fixed"
          cases: "mcp-check-demo/cases"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify excel-mcp-server with schema fuzzing
        run: |
          git clone --depth 1 https://github.com/haris-musa/excel-mcp-server.git /tmp/excel-mcp-server
          cd /tmp/excel-mcp-server
          uv sync --locked
          node "$GITHUB_WORKSPACE/mcp-contract-check/dist/cli.js" --command "uv run excel-mcp-server stdio" --fuzz
