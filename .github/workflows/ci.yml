name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build
        run: |
          cd mcp-contract-check && npm install && npm run build
          cd ../mcp-contract-check-action && npm install && npm run build
          cd ../mcp-check-demo && npm install

      - name: Run unit & integration tests
        run: |
          cd mcp-contract-check && npm test
          cd ../mcp-contract-check-action && npm test

      - name: Run Action on demo server
        uses: ./
        with:
          command: "node mcp-check-demo/server.js --fixed"
          cases: "mcp-check-demo/cases"
