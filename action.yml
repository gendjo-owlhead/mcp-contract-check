name: MCP contract check
description: "Automated contract testing, schema fuzzing, and breaking change detection for Model Context Protocol (MCP) servers."
author: gendzaj
inputs:
  command:
    description: "The stdio server command"
    required: false
  url:
    description: "Remote MCP server endpoint URL"
    required: false
  transport:
    description: "Remote transport protocol: auto, sse, streamable-http"
    required: false
    default: "auto"
  headers:
    description: "Custom HTTP headers for remote transport (JSON or key: value lines)"
    required: false
  cases:
    description: "Directory containing test case fixtures"
    required: false
    default: "cases"
  fuzz:
    description: "Automatically synthesize test cases from tool input schemas"
    required: false
    default: "false"
  baseline:
    description: "Path to baseline contract JSON snapshot to check for breaking changes"
    required: false
  save-contract:
    description: "Path to save current contract snapshot JSON"
    required: false
  license-key:
    description: "License key for private repositories"
    required: false
  license-server-url:
    description: "License verification server URL"
    required: false
    default: "https://mcp-license-service.onrender.com"
  fail-open:
    description: "Allow CI checks to proceed with a warning if the license server is unreachable or encounters an outage"
    required: false
    default: "true"
outputs:
  total:
    description: "Total number of test cases checked"
  passed:
    description: "Number of passed contract test cases"
  failed:
    description: "Number of failed contract test cases"
  compatible:
    description: "Whether contract changes are backward-compatible with baseline"
branding:
  icon: shield
  color: blue
runs:
  using: node20
  main: mcp-contract-check-action/dist/index.js
