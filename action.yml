name: MCP contract check
description: Fail the build when an MCP server's tool responses do not match their JSON Schema.
author: gendzaj
inputs:
  command:
    description: The stdio server command
    required: false
  url:
    description: Remote MCP server SSE endpoint URL
    required: false
  headers:
    description: Custom HTTP headers for remote SSE transport (JSON or key: value lines)
    required: false
  cases:
    description: Directory containing test case fixtures
    required: false
    default: cases
  fuzz:
    description: Automatically synthesize test cases from tool input schemas
    required: false
    default: "false"
  baseline:
    description: Path to baseline contract JSON snapshot to check for breaking changes
    required: false
  save-contract:
    description: Path to save current contract snapshot JSON
    required: false
  license-key:
    description: License key for private repositories
    required: false
  license-server-url:
    description: License verification server URL
    required: false
    default: "https://mcp-license-service.onrender.com"
branding:
  icon: shield
  color: blue
runs:
  using: node20
  main: mcp-contract-check-action/dist/index.js
