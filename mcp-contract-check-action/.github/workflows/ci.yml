name: Continuous Integration

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd mcp-contract-check && npm install && npm run build
          cd ../mcp-contract-check-action && npm install

      - name: Build action
        run: npm run build
        working-directory: mcp-contract-check-action

      - name: Run tests
        run: npm test
        working-directory: mcp-contract-check-action
